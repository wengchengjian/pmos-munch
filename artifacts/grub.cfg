set timeout=3
set default=0

menuentry 'postmarketOS (headless)' {
    search --no-floppy --label PMOSBOOT --set=root
    devicetree /boot/dtb.bin
    linux /boot/vmlinuz-pmos quiet loglevel=4 pmos_root_uuid=687be8df-d76e-40ac-b251-8a4032ad04f3 pmos_rootfsopts=defaults fbcon=map:1
    initrd /boot/initramfs.gz
    clear
}
